# Configuration for https://github.com/crate-ci/typos

[files]
extend-exclude = [
    "hypervisor/src/kvm/x86_64/mod.rs",
    "resources/linux-config-*",
]

[default.extend-words]
CLASSE = "CLASSE"
Dake = "Dake"
EXTINT = "EXTINT"
INOUT = "INOUT"
MSIS = "MSIS" # MSIs (Message Signaled Interrupt)
SME = "SME" # Secure Memory Encryption
THR = "THR" # Transmitter Holding Register
TRANSLATER = "TRANSLATER"
ba = "ba"
conectix = "conectix"
liness = "liness"
outout = "outout"

[default.extend-identifiers]
consts = "consts"
fo = "fo"
fpr = "fpr"
# Public Linux API
msg_controllen = "msg_controllen"
tme = "tme"
l3c_qm_conver_factor = "l3c_qm_conver_factor"
IA32_PMC_GPn_CFG_C = "IA32_PMC_GPn_CFG_C"
IA32_PMC_FXm_CFG_C = "IA32_PMC_FXm_CFG_C"
